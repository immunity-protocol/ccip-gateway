# fly.io config for the Immunity CCIP-Read gateway.
#
# Deploy:
#   fly launch --no-deploy            # (first time, accept this config)
#   fly secrets set SIGNER_PRIVATE_KEY=0x...   # the trusted signer key
#   fly deploy
#
# The L2 RPC + contract addresses default in src/config.ts; override with
# `fly secrets set L2_RPC_URL=...` etc. if needed.
app = "immunity-ccip-gateway"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
